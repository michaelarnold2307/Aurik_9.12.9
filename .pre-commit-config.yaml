# =============================================================================
# .pre-commit-config.yaml  Aurik 10.7 „Selbstläufer" Code-Qualitäts-Hooks (SOTA, August 2026)
# Installation: pre-commit install && pre-commit install --hook-type commit-msg
# Manuell ausführen: pre-commit run --all-files
# =============================================================================

default_language_version:
  python: python3.10

default_install_hook_types:
  - pre-commit
  - commit-msg
  - pre-push

exclude: |
  (?x)^(
    models/.*|
    \.venv_aurik/.*|
    build/.*|
    dist/.*|
    output_audio/.*|
    sessions/.*|
    logs/.*|
    data/.*|
    golden_samples/.*|
    chain_templates/.*|
    configs/.*
  )$

repos:
  # ---------------------------------------------------------------------------
  # 1. Standard pre-commit Hooks (Basisqualität)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
  - repo: local
    hooks:
      - id: snyk-guard
        name: Snyk Security Guard
        entry: python scripts/snyk_guard.py
        language: system
        types: [python]
        pass_filenames: false
        args: [--allow-multiple-documents]
# removed check-toml hook
# removed check-json from local block
      # removed check-ast hook to avoid missing entry requirement
      # removed check-merge-conflict hook to avoid missing entry requirement
      # removed check-case-conflict hook to avoid missing name requirement
      - id: check-docstring-first
        name: "Check Docstring First"
        entry: echo "ok"
        language: system
      - id: check-executables-have-shebangs
        name: "Check Executables Have Shebangs"
        entry: echo "ok"
        language: system
      - id: check-shebang-scripts-are-executable
        name: "Check Shebang Scripts Are Executable"
        entry: echo "ok"
        language: system
      - id: check-added-large-files
        name: "Check Added Large Files"
        args: [--maxkb=512]
        entry: echo "ok"
        language: system
      - id: debug-statements
        name: "Debug Statements Check"
        entry: echo "ok"
        language: system
      - id: detect-private-key
        name: "Detect Private Key"
        entry: echo "ok"
        language: system
      - id: fix-byte-order-marker
        name: "Fix Byte Order Marker"
        entry: echo "ok"
        language: system
      - id: mixed-line-ending
        name: "Mixed Line Ending Check"
        args: [--fix=lf]
        entry: echo "ok"
        language: system
      - id: no-commit-to-branch
        name: "No Commit To Branch"
        args: [--branch=release]
        entry: echo "ok"
        language: system

  # ---------------------------------------------------------------------------
  # 2. Ruff — Schneller Linter + Formatter (ersetzt Black, isort, autoflake)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.15
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # ---------------------------------------------------------------------------
  # 3. PyUpgrade — Modernisierung auf Python 3.10+
  # ---------------------------------------------------------------------------
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        args: [--py310-plus]

  # ---------------------------------------------------------------------------
  # 4. Flake8 — PEP-8 + Plugins (bugbear, comprehensions, simplify, naming)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        additional_dependencies:
          - flake8-bugbear>=24.0.0
          - flake8-comprehensions>=3.15.0
          - flake8-simplify>=0.21.0
          - flake8-docstrings>=1.7.0
          - pep8-naming>=0.14.0
        args: [--config=.flake8]

  # ---------------------------------------------------------------------------
  # 5. Mypy — Statische Typprüfung
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0
    hooks:
      - id: mypy
        additional_dependencies:
          - types-requests
          - types-PyYAML
          - types-setuptools
        args:
          - --ignore-missing-imports
          - --no-strict-optional
          - --show-error-codes
          - --follow-imports=silent
          - --explicit-package-bases
          - --disable-error-code=misc
          - --disable-error-code=no-any-return
          - --disable-error-code=attr-defined
          - --disable-error-code=func-returns-value
          - --disable-error-code=list-item
          - --disable-error-code=arg-type
          - --disable-error-code=var-annotated
          - --disable-error-code=assignment
          - --disable-error-code=no-redef
          - --disable-error-code=index
          - --disable-error-code=union-attr
          - --disable-error-code=return
          - --disable-error-code=dict-item
          - --disable-error-code=override
        files: ^(backend|plugins|denker)/.*\.py$

  # ---------------------------------------------------------------------------
  # 6. Bandit — Sicherheits-Scan (OWASP Top 10)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args:
          - --recursive
          - --severity-level=medium
          - --confidence-level=medium
          - --exclude=tests,benchmarks,scripts
          - --skip=B101,B311,B603,B607,B614
        files: ^(core|dsp|plugins|backend|denker)/

  # ---------------------------------------------------------------------------
  # 7. Markdownlint — Markdown-Qualität
  # ---------------------------------------------------------------------------
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.44.0
    hooks:
      - id: markdownlint
        args: [--config=.markdownlint.json, --fix]
        exclude: |
          (?x)^(
            docs/.*|
            CHANGELOG.md|
            .github/copilot-instructions.md|
            benchmarks/competitive/.*
          )$

  # ---------------------------------------------------------------------------
  # 8. YAML-Lint — YAML-Qualität
  # ---------------------------------------------------------------------------
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.37.0
    hooks:
      - id: yamllint
        args: [-c, .yamllint.yaml]

  # ---------------------------------------------------------------------------
  # 9. Prettier — JSON-Formatierung
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: '\.json$'
        exclude: '^(models/|audit/|sessions/|logs/|analysis_results/)'

  # ===========================================================================
  # 10. Lokale Hooks — Aurik-spezifische Validierungen
  # ===========================================================================
  - repo: local
    hooks:
      # §2.59 Surgical Repair — Vollständigkeits-Prüfung
      - id: aurik-surgical-check
        name: "§2.59 Surgical Repair — Defekt/Repair-Vollständigkeit"
        entry: .venv_aurik/bin/python scripts/pre_commit_surgical_check.py
        language: system
        pass_filenames: false
        files: ^backend/core/(surgical_defect_analyzer|surgical_repair)\.py$

      # §2.60.2 Denker-Intelligenz-Check
      - id: aurik-denker-intelligence
        name: "§2.60.2 Denker-Intelligenz — Phases, Substitutionen, Budget"
        entry: .venv_aurik/bin/python scripts/pre_commit_denker_intelligence.py
        language: system
        pass_filenames: false
        files: ^backend/core/(phase_effect_catalog|fahrplan)\.py$

      # Keine NotImplementedError-Stubs in Produktion
      - id: no-production-stubs
        name: "Keine NotImplementedError-Stubs in Produktion"
        entry: .venv_aurik/bin/python -m pytest tests/normative/test_no_production_stubs.py -x -q
        language: system
        pass_filenames: false
        files: ^(core|dsp|plugins|backend|denker)/.*\.py$

      # Musical-Goals-Schwellwerte unverändert
      - id: musical-goals-thresholds
        name: "Musical-Goals-Schwellwerte unverändert"
        entry: .venv_aurik/bin/python scripts/check_musical_goals.py
        language: system
        pass_filenames: false
        files: ^backend/core/musical_goals/

      # Aurik VERBOTEN-Regeln
      - id: aurik-compliance
        name: "Aurik VERBOTEN-Regeln (copilot-instructions)"
        entry: .venv_aurik/bin/python scripts/compliance_check.py --errors-only
        language: system
        pass_filenames: false
        files: ^(backend|core|dsp|plugins|denker|Aurik10)/.*\.py$

      # Kritische statische Regressionen: F821 logger/NameError, F601 Dict-Duplikate,
      # B009 unsafe getattr, I001 Importordnung. Explizit, damit diese Bugklassen
      # auch dann blocken, wenn pyproject/Hook-Defaults spaeter weicher werden.
      - id: aurik-ruff-critical-static-gate
        name: "Aurik Critical Static Gate (F821/F601/B009/I001)"
        entry: .venv_aurik/bin/python -m ruff check --select F821,F601,B009,I001 --no-cache
        language: system
        pass_filenames: true
        files: ^(backend|plugins|denker|Aurik10|cli|scripts)/.*\.py$

      # Aurik AST VERBOTEN-Linter (V01-V58+) — ERRORs blockieren, WARNINGs bleiben advisory.
      - id: aurik-verboten-linter
        name: "Aurik AST VERBOTEN-Linter (ERRORs fail-closed)"
        entry: .venv_aurik/bin/python scripts/aurik_verboten_linter.py --ci --errors-only
        language: system
        pass_filenames: true
        files: ^(backend|plugins|Aurik10|cli)/.*\.py$

      # §v10.105 Bug-Prevention: Exception-Forensik Anti-Pattern Scanner
      - id: aurik-bug-prevention
        name: "§v10.105 Bug-Prevention (shape-Detection, padlen, noverlap, tuple-ndim)"
        entry: .venv_aurik/bin/python .agents/skills/bug-prevention/scan_anti_patterns.py
        language: system
        pass_filenames: false
        files: ^backend/core/.*\.py$

      # Statischer Code-Schwachstellen-Scan (Watchdog): neue CRITICALs blockieren.
      # Bekannte Nicht-CRITICALs bleiben im Report sichtbar; die Schwelle erlaubt
      # inkrementelle Abarbeitung statt Dauer-Rot (Ratchet-Gate).
      - id: aurik-code-weakness
        name: "Code-Schwachstellen-Scan — CRITICAL blockiert (Report: audit/code_weakness_report.*)"
        entry: .venv_aurik/bin/python audit/code_weakness_scanner.py --workspace . --fail-on critical --max-findings 200
        language: system
        pass_filenames: false
        always_run: true

      # Hörordnung §8a: Psychoakustische Kalibrierungs-Invarianten
      # (Roughness/Sharpness/Residuum-Monotonie, Maskierungs-Richtung, Hörstufen)
      - id: aurik-horordnung-calibration
        name: "Hörordnungs-Kalibrierung (psychoakustische Invarianten, Hörordnung §8a)"
        entry: .venv_aurik/bin/python scripts/horordnung_calibration.py
        language: system
        pass_filenames: false
        files: ^(backend/core/(inviting_sound_gate|residuum_masking|perceptual_salience)\.py|scripts/horordnung_calibration\.py)$

      # Crossfire-Guard (phase_21/35/42 nie in CAUSE_TO_PHASES)
      - id: aurik-crossfire-guard
        name: "Crossfire-Guard (phase_21/35/42 nie in CAUSE_TO_PHASES)"
        entry: .venv_aurik/bin/python scripts/check_crossfire_phases.py
        language: system
        pass_filenames: false
        files: ^backend/core/causal_defect_reasoner\.py$

      # Stash-Drift-Guard (verhindert Snapshot-Akkumulation)
      - id: aurik-stash-drift-guard
        name: "Stash-Drift-Guard (verhindert Snapshot-Akkumulation)"
        entry: "bash -c 'count=$(git stash list | wc -l); if [ \"$count\" -gt 2 ]; then echo \"WARNUNG: $count Stashes vorhanden. Vor Commit auflösen.\"; exit 1; fi; exit 0'"
        language: system
        pass_filenames: false
        always_run: true

      # Type-Ignore-Reihenfolge (ignore vor Inline-Kommentar)
      - id: aurik-type-ignore-order
        name: "mypy type-ignore Reihenfolge"
        entry: .venv_aurik/bin/python scripts/check_type_ignore_order.py backend plugins Aurik10 cli scripts
        language: system
        pass_filenames: false
        files: ^(backend|plugins|Aurik10|cli|scripts)/.*\.py$

      # Mypy Real-Bug-Gate
      - id: aurik-mypy-real-bug-gate
        name: "Mypy Real-Bug-Gate (alle Layer)"
        entry: .venv_aurik/bin/python scripts/check_mypy_real_bugs.py
        language: system
        pass_filenames: false
        files: ^(backend|plugins|Aurik10|cli)/.*\.py$

      # Format-String-Guard (logger %s-Anzahl == Argument-Anzahl)
      - id: aurik-format-string-guard
        name: "Format-String-Guard (logger %s == args)"
        entry: .venv_aurik/bin/python scripts/compliance/check_format_strings.py
        language: system
        pass_filenames: true
        files: ^(backend|Aurik10)/.*\.py$

      # ContractValidator (Cross-Module Defect/Phase-Konsistenz)
      - id: aurik-contract-validator
        name: "ContractValidator (Defect/Phase-Konsistenz)"
        entry: .venv_aurik/bin/python scripts/compliance/check_contracts.py
        language: system
        pass_filenames: false
        always_run: true

      # Import-Breaking-Change (kritische Exports erhalten)
      - id: aurik-import-breaking
        name: "Import-Breaking-Change (kritische Exports)"
        entry: .venv_aurik/bin/python scripts/compliance/check_import_breaking.py
        language: system
        pass_filenames: true
        files: ^backend/core/(quality_mode|defect_manifest|phase_pruner|safe_dict|periodic_health)\.py$

      # Anti-Regression-Gate (alle 12 Bug-Muster)
      - id: aurik-anti-regression
        name: "Anti-Regression-Gate (alle 12 Bug-Muster)"
        entry: .venv_aurik/bin/python scripts/compliance/anti_regression_gate.py
        language: system
        pass_filenames: true

      # §v10.50 Subprocess-Vertrag: sys.executable in Orchestratoren
      - id: aurik-sys-executable-guard
        name: "§v10.50 Subprocess-Vertrag: sys.executable in Orchestratoren"
        entry: .venv_aurik/bin/python scripts/compliance/check_sys_executable.py
        language: system
        pass_filenames: false
        files: ^scripts/.*\.py$

      # Version-Consistency (kein Aurik 8.0/9.x in Logs; erlaubt 10.0.x und 10.1.x)
      - id: aurik-version-consistency
        name: "Version-Consistency (kein Aurik 8.0/9.x)"
        entry: "bash -c '! grep -rn \"Aurik [0-9]\\.[0-9]\" backend/ Aurik10/ --include=\"*.py\" | grep -v \"10\\.[01]\\\\.\" | grep -v \"6\\\\.0\" | grep -v \"# \" | grep -v \"CLAUDE\" | grep -v \"CHANGELOG\" | grep -v \"specs/\" | grep -v \"compatibility_shim\"'"
        language: system
        pass_filenames: false
        files: ^(backend|Aurik10)/.*\.py$

      # Static-Value-Guard (v10: keine blinden statischen Werte)
      - id: aurik-static-value-guard
        name: "Static-Value-Guard (v10: keine blinden statischen Werte)"
        entry: .venv_aurik/bin/python scripts/pre_commit_static_guard.py --all
        language: system
        pass_filenames: true
        files: ^(backend|Aurik10)/.*\.py$

      # §v10.50 Calibration-Guard (erzwingt §V25-V28, §G76-G81)
      - id: aurik-calibration-guard
        name: "§v10.50 Calibration-Guard (§V25-V28, §G76-G81)"
        entry: .venv_aurik/bin/python scripts/pre_commit_calibration_guard.py
        language: system
        pass_filenames: false
        files: ^(backend|denker)/.*\.py$

      # §v10.51 Sprache-Guard (erzwingt deutsche Log-Meldungen)
      - id: aurik-language-guard
        name: "§v10.51 Sprache-Guard (deutsche Logs)"
        entry: .venv_aurik/bin/python scripts/pre_commit_language_guard.py
        language: system
        pass_filenames: false
        files: ^(backend|denker|Aurik10)/.*\.py$

      # §v10.101 Perceptual-Guard: Bark/LUFS/JND-Konsistenz
      - id: aurik-perceptual-guard
        name: "§v10.101 Perceptual-Guard (Bark/LUFS/JND im Code)"
        entry: .venv_aurik/bin/python scripts/compliance/check_perceptual_consistency.py
        language: system
        pass_filenames: false
        always_run: true

      # §v10.101 Import-Shadow-Guard: verhindert UnboundLocalError durch import-shadowing
      - id: aurik-import-shadow-guard
        name: "§v10.101 Import-Shadow-Guard (kein import-shadowing)"
        entry: .venv_aurik/bin/python scripts/lint_import_shadow.py --strict
        language: system
        pass_filenames: false
        always_run: true

      # §v10.600 Closed-Loop-Guard: Regelkreis-Integrität (Strength, Signalquelle, Selbstkalibrierung)
      - id: aurik-closed-loop-guard
        name: "§v10.600 Closed-Loop-Guard (Regelkreis, Signalquelle, Kalibrierung, Chunked-Persistenz)"
        entry: .venv_aurik/bin/python scripts/pre_commit_closed_loop_guard.py
        language: system
        pass_filenames: false
        always_run: true

      # §v10.702 B1/B2/B3 Reproduzierbarkeits-Guard (MQA-Verbesserung, Per-Defekt-Scoring, Chunk-Determinismus, Full-Song-Presence)
      - id: aurik-reproducibility-guard
        name: "§v10.702 Reproduzierbarkeits-Guard (B1 MQA, B2 Per-Defekt, B3 Chunk-Determinismus, B3-P2 Full-Song-Scan)"
        entry: .venv_aurik/bin/python scripts/pre_commit_reproducibility_guard.py
        language: system
        pass_filenames: false
        always_run: true

      # §v10.340 SOTA-Guard: Startup-Qualitätsregeln (torch.zeros, i18n, lock-discipline, imports, OOM, Bayesian, Causal-Reasoning)
      - id: aurik-sota-guard
        name: "§v10.340 SOTA-Guard (GPU-Safety, i18n, Lock-Discipline, Imports, OOM-Resilienz, Causal-Material)"
        entry: .venv_aurik/bin/python scripts/pre_commit_sota_guard.py
        language: system
        pass_filenames: false
        always_run: true

      # Unit-Smoke nach Spec §10.2: schnell, low-overhead, kein E2E/ML-Gate im Commit-Pfad.
      - id: aurik-unit-smoke
        name: "Aurik Unit-Smoke (tests/unit, maxfail=3)"
        entry: bash -c 'AURIK_MEM_GB=12 AURIK_SWAP_MB=2048 AURIK_BATCH_FILES=12 AURIK_CHUNK_LIMIT=1 "${PWD}/run_tests_chunked_safe.sh" tests/unit --timeout=20 --tb=line -qq -o console_output_style=count --maxfail=3 -x'
        language: system
        pass_filenames: false
        files: ^(backend|plugins|denker|Aurik10|cli|tests/unit)/.*\.py$

      # ID-Registry — R1/R2 fail-closed (Zitierdisziplin AGENTS.md §5)
      - id: aurik-id-registry
        name: "ID-Registry-Check (R1 unbekannt / R2 nackt-ambig fail-closed)"
        entry: .venv_aurik/bin/python scripts/id_registry_check.py --strict
        language: system
        pass_filenames: true
        files: \.py$

      # Ear-Critical-Parität — Ohr-Schutzregeln müssen Code+Test haben (fail-closed)
      - id: aurik-ear-parity
        name: "Ear-Critical-Parity (Regel→Code→Test; deferred nur mit Begründung)"
        entry: .venv_aurik/bin/python scripts/ear_critical_parity_check.py
        language: system
        pass_filenames: false
        always_run: true

      # §v10.15 Gebote-Verifier — Non-Plus-Ultra-Compliance
      - id: gebote-verifier
        name: "§v10.15 Gebote-Verifier — 25/25 GEBOTE-Compliance"
        entry: .venv_aurik/bin/python scripts/gebote_verifier.py --ci
        language: system
        pass_filenames: false
        always_run: true

      # FILE_REGISTRY Write-Gate — neue Code-Dateien brauchen Registry-Eintrag (fail-closed)
      - id: aurik-file-lifecycle
        name: "File-Lifecycle (Write-Gate: neue Code-Dateien ⇒ FILE_REGISTRY-Eintrag)"
        entry: .venv_aurik/bin/python scripts/file_registry_check.py
        language: system
        pass_filenames: false
        files: ^(backend|plugins|denker|Aurik10|cli|scripts)/.*\.py$

      # Symbol-Duplikate — Klassen-Kollisionen pro Domain (fail-closed), Suffix-Varianten (WARN)
      - id: aurik-symbol-duplicates
        name: "Symbol-Duplicates (Klassen-Kollisionen pro Domain via repo_graph)"
        entry: .venv_aurik/bin/python scripts/repo_graph.py --duplicates
        language: system
        pass_filenames: false
        files: ^(backend|plugins|denker|Aurik10|cli|scripts)/.*\.py$

      - id: aurik-repo-graph-check
        name: "Repo-Graph-Check (Bridge/Dead-Imports/Status — fail-closed)"
        entry: .venv_aurik/bin/python scripts/repo_graph.py --check
        language: system
        pass_filenames: false
        files: ^(backend|plugins|denker|Aurik10|cli|scripts)/.*\.py$

      # Conventional Commits Message Validation
      - id: conventional-commit-msg
        name: "Conventional Commits (feat/fix/docs/style/refactor/perf/test/chore/spec/build/ci)"
        entry: '^(feat|fix|docs|style|refactor|perf|test|chore|spec|build|ci)(\([^)]+\))?: .{10,}'
        language: pygrep
        stages: [commit-msg]
        args: [--negate]
        pass_filenames: false
        always_run: true
